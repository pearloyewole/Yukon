<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[YUKON] Home</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="homeApp" class="home-root onboarding-root">
      <div class="onboarding-grid"></div>

      <main class="home-shell">
        <header class="top-header">
          <div class="top-header-brand">YUKON</div>
        </header>

        <section class="home-welcome shell-panel" aria-label="Welcome image">
          <img
            class="home-welcome-image"
            src="/assets/home%20screen%20image.jpg"
            alt="Aerial river scene"
          />
        </section>

        <section class="start-panels home-panels">
          <button id="openLoggedAnalyses" type="button" class="start-card shell-panel">
            <h2>Logged Analyses</h2>
            <p>Open the dedicated logged analyses page to view saved rivers.</p>
            <div id="loggedAnalysesMeta" class="start-meta"></div>
          </button>

          <button id="openSetupPage" type="button" class="start-card shell-panel">
            <h2>Load River Analysis</h2>
            <p>Upload overview sheet, MAT zip, sonar zip, GeoTIFF elevation, and river shapefile to compile JSON.</p>
          </button>
        </section>

      </main>
    </div>

    <script type="module" src="/src/home.js"></script>
  </body>
</html>
