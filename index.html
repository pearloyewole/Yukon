<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yukon — three.js visualizations</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- three.js scene mounts to body by default in the example -->
    <div id="overlay">
      <div id="flow-label">Flow</div>
      <div id="legend-horizontal">
        <div class="legend-title">Horizontal velocity magnitude (m s⁻¹)</div>
        <div class="legend-container">
          <div class="legend-bar"></div>
          <div class="legend-ticks">
            <span class="legend-tick" style="left: 0%"><span class="tick-mark"></span><span class="tick-value legend-min"></span></span>
            <span class="legend-tick" style="left: 25%"><span class="tick-mark"></span><span class="tick-value"></span></span>
            <span class="legend-tick" style="left: 50%"><span class="tick-mark"></span><span class="tick-value"></span></span>
            <span class="legend-tick" style="left: 75%"><span class="tick-mark"></span><span class="tick-value"></span></span>
            <span class="legend-tick" style="left: 100%"><span class="tick-mark"></span><span class="tick-value legend-max"></span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
